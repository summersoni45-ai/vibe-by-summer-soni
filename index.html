<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Vibe by Summer Soni</title><style>

0 13px}.field:focus{border-color:#9c8bc9}.primary{border:0;background:#49337d;color:#fff;border-radius:28px;padding:12px 20px;font-weight:700}.secondary{border:0;background:var(--pale);color:#49337d;border-radius:25px;padding:11px 17px;font-weight:700}.empty{min-height:45vh;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:12px}.empty .art{font-size:70px;color:#b7a8e0}.empty h2{font-size:19px;margin:0}.empty p{max-width:280px;color:var(--muted);line-height:1.6;margin:0 0 4px}.storyrow{display:flex;gap:18px;overflow:auto;margin:12px 0 20px}.story{text-align:center;min-width:73px;font-size:12px}.ring{height:62px;width:62px;border:2px solid #c6b6e8;border-radius:50%;display:grid;place-items:center;margin:auto auto 7px;font-size:24px;background:#f6f3fc}.search{display:flex;align-items:center;gap:8px;background:#f4f2f8;border-radius:30px;padding:0 14px;margin:22px 0 8px}.search input{border:0;background:none;outline:0;width:100%;padding:14px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 1px;border-bottom:1px solid var(--line)}.row .left{display:flex;align-items:center;gap:13px}.row .sym{width:31px;text-align:center;font-size:20px;color:#65528f}.row .label{font-weight:600}.row .desc{font-size:12px;color:var(--muted);margin-top:3px}.chev{color:#aaa4b7;font-size:20px}.section{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#8b829e;font-weight:800;margin:25px 0 5px}.back{border:0;background:none;font-size:24px;padding:0 10px 0 0}.headrow{display:flex;align-items:center;gap:8px;margin-bottom:20px}.headrow h1{font-size:21px;margin:0}.toggle{accent-color:#66529a;width:19px;height:19px}.avatar{height:78px;width:78px;border-radius:50%;background:#e9e3f7;display:grid;place-items:center;font-size:30px;color:#65528f;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.profiletop{text-align:center;display:grid;justify-items:center;gap:8px}.stats{display:flex;justify-content:space-around;text-align:center;margin:22px 0}.stats strong{display:block;font-size:17px}.stats span{font-size:12px;color:var(--muted)}.postmedia{width:100%;max-height:440px;object-fit:cover;border-radius:12px;background:#f4f1fa}.postvideo{width:100%;max-height:440px;border-radius:12px;background:#191622}.postactions{display:flex;gap:10px;align-items:center;margin-top:10px}.postactions button{border:0;background:none;padding:5px;font-size:18px}.postactions .spacer{flex:1}.postheader{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.badge{font-size:11px;background:#f3effc;color:#63518e;padding:4px 8px;border-radius:20px}.notice{background:#f7f5fc;color:#675a82;padding:11px 13px;border-radius:12px;font-size:12px;line-height:1.5}.auth{padding:60px 26px;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}.auth h1{text-align:center;font-size:24px;margin:0 0 5px}.auth p{text-align:center;color:var(--muted);margin:0 0 30px}.auth .brand{text-align:center;font-size:57px;margin-bottom:18px}.link{background:none;border:0;color:var(--accent);font-weight:700;padding:10px}.textarea{min-height:88px;resize:vertical}.toast{position:fixed;z-index:99;left:50%;bottom:86px;transform:translateX(-50%);background:#302943;color:white;padding:11px 17px;border-radius:30px;max-width:90%;text-align:center;box-shadow:0 10px 25px #0002}.small{font-size:12px;color:var(--muted)}.chip{border-radius:12px;background:#f4f2f9;padding:12px;margin:7px 0}.settingslink{display:block;color:var(--ink);text-decoration:none}.tiny{font-size:11px;color:#999}.noborder{border:0}.danger{color:#a53c5b}.modal{position:fixed;inset:0;background:#0006;z-index:40;display:flex;align-items:flex-end;justify-content:center}.sheet{background:white;border-radius:22px 22px 0 0;width:min(470px,100%);padding:24px 22px 36px;max-height:75vh;overflow:auto}.sheet h3{margin-top:0}
</style></head><body><div id="app"></div><script>
'use strict';
const KEY='vibe_test_v2';
const firebaseConfig={apiKey:'AIzaSyCCQWlJoPE5DiHAIhg-MkCqAVZKOO0lV8E',authDomain:'vibe-by-summer-soni-b19cc.firebaseapp.com',projectId:'vibe-by-summer-soni-b19cc',storageBucket:'vibe-by-summer-soni-b19cc.firebasestorage.app',messagingSenderId:'763770330900',appId:'1:763770330900:web:b484abf2807e00fed96c01'};
let fb=null,fbUser=null,authReady=false;
const initial={user:null,posts:[],stories:[],messages:[],groups:[],notifications:[],prefs:{private:false,mentions:'Followers',tags:'Followers',messages:'Everyone',groupInvites:'Followers',storyAudience:'Everyone',storyHours:'24',readReceipts:true,activity:true,twoFactor:false,quiet:false,hidePreview:false,sensitive:'Less',hiddenWords:'',theme:'Minimal Light',notifications:true},history:[],blocked:[],restricted:[],searches:[]};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){data=structuredClone(initial)};
for(const k of Object.keys(initial)){if(!(k in data))data[k]=structuredClone(initial[k])}data.prefs={...initial.prefs,...data.prefs};
let sessionActive=false;let route='home',sub='',searchTab='Top',inboxTab='Chats',profileTab='Posts',authMode='login',tempMedia=null,tempStory=null,replyPost=null,toastTimer=null;
const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{if(fbUser)localStorage.setItem(KEY+'_'+fbUser.uid,JSON.stringify(data))}catch(e){notify('Browser storage full. Try a smaller photo or video.')}}
function notify(s){document.querySelector('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.textContent=s;document.body.append(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),2900)}
function log(s){data.history.unshift({text:s,time:Date.now()});data.history=data.history.slice(0,40)}
function go(r,s=''){route=r;sub=s;render();window.scrollTo(0,0)}
function nav(){return `<nav class="nav">${[['home','⌂','Home'],['search','◎','Search'],['create','+',''],['inbox','▤','Inbox'],['profile','♙','Profile']].map(([r,i,t])=>`<button data-go="${r}" class="${route===r?'active':''}">${r==='create'?`<span class="plus">+</span>`:`<span class="glyph">${i}</span><span>${t}</span>`}</button>`).join('')}</nav>`}
function shell(html){app.innerHTML=`<main class="screen">${html}</main>${nav()}`;bind()}
function heading(s){return `<div class="headrow"><button class="back" data-back="1">‹</button><h1>${esc(s)}</h1></div>`}
function empty(icon,title,detail,button=''){return `<div class="empty"><div class="art">${icon}</div><h2>${title}</h2><p>${detail}</p>${button}</div>`}
function avatar(size=78){return `<div class="avatar" style="width:${size}px;height:${size}px">${data.user?.photo?`<img src="${data.user.photo}" alt="Profile">`:'✦'}</div>`}
function auth(){app.innerHTML=`<div class="auth"><div class="brand" style="font-size:37px;letter-spacing:-1.5px">Vibe by Summer Soni<span>✦</span></div><h1>${authMode==='login'?'Welcome back':'Create your account'}</h1><p>White, simple, and made for your moments.</p><form id="authform">${authMode==='signup'?`<label>Display name<input class="field" name="name" maxlength="45" required placeholder="Your name"></label><label>Username<input class="field" name="username" maxlength="25" pattern="[A-Za-z0-9_.]{3,25}" required placeholder="your.username"></label>`:''}<label>Email<input class="field" name="email" type="email" required placeholder="name@example.com"></label><label>Password<input class="field" name="password" type="password" minlength="6" required placeholder="At least 6 characters"></label><button class="primary" id="authsubmit" style="width:100%">${authMode==='login'?'Log In':'Sign Up'}</button></form><p style="margin:18px 0 0"><button class="link" id="swapauth">${authMode==='login'?'New here? Sign Up':'Have an account? Log In'}</button></p><div class="notice">Real Firebase account login. Posts, stories and notes-to-self remain device-only previews until the cloud features are implemented. Do not upload private media here.</div></div>`;
document.getElementById('swapauth').onclick=()=>{authMode=authMode==='login'?'signup':'login';auth()};
document.getElementById('authform').onsubmit=async e=>{e.preventDefault();if(!fb)return notify('Firebase is still loading. Try again.');let f=new FormData(e.target),email=String(f.get('email')).trim().toLowerCase(),password=String(f.get('password')),btn=document.getElementById('authsubmit');btn.disabled=true;try{if(authMode==='signup'){const name=String(f.get('name')).trim(),username=String(f.get('username')).trim();const cred=await fb.createUserWithEmailAndPassword(fb.auth,email,password);await fb.setDoc(fb.doc(fb.db,'users',cred.user.uid),{name,username,email,bio:'',joined:fb.serverTimestamp(),usernameChanged:null});}else await fb.signInWithEmailAndPassword(fb.auth,email,password);}catch(err){notify(err.code==='auth/email-already-in-use'?'Email already registered. Try Log In.':err.code==='auth/invalid-credential'?'Incorrect email or password.':err.code==='permission-denied'?'Firestore access denied. Apply the supplied secure rules.':(err.message||'Could not sign in.'));btn.disabled=false}}}

function home(){const validStories=data.stories.filter(s=>s.expires>Date.now());shell(`<div class="top"><div class="brand">Vibe by Summer Soni<span>✦</span></div><div class="icons"><button class="iconbtn" data-go="search" aria-label="Search">⌕</button><button class="iconbtn" data-go="notifications" aria-label="Notifications">♧</button></div></div><div class="storyrow"><div class="story" data-go="storycreate"><div class="ring">＋</div>Your Story</div>${validStories.map(s=>`<div class="story" data-story="${s.id}"><div class="ring">✦</div>My Story</div>`).join('')}</div>${data.posts.length?data.posts.map(postCard).join(''):empty('▧','Your Vibe starts here ✨','Share your first Drop. Your feed stays empty until you create something.',`<button class="primary" data-go="create">Create a Post ＋</button>`)}`)}
function postCard(p){return `<article class="card"><div class="postheader"><div><strong>${esc(data.user.username)}</strong> <span class="badge">${p.edited?'Edited · ':''}${new Date(p.time).toLocaleDateString()}</span></div><button class="iconbtn" data-action="postmenu" data-id="${p.id}">⋯</button></div>${p.type==='video'?`<video class="postvideo" src="${p.media}" controls playsinline preload="metadata"></video>`:`<img class="postmedia" src="${p.media}" alt="Drop photo">`}<div class="postactions"><button data-action="spark" data-id="${p.id}">${p.spark?'♥':'♡'} <span class="small">${p.spark?'1':'0'}</span></button><button data-action="echo" data-id="${p.id}">♧ <span class="small">${p.echoes.length}</span></button><span class="spacer"></span><button data-action="keep" data-id="${p.id}">${p.keep?'▣':'▢'}</button></div><div>${esc(p.caption)}</div>${p.echoes.length?`<div class="small" style="margin-top:8px">${p.echoes.map(e=>`<div style="margin:7px 0">${esc(e.text)} <button class="link" data-action="deleteecho" data-id="${p.id}" data-eid="${e.id}">Delete</button></div>`).join('')}</div>`:''}</article>`}
function search(){shell(`<h1 class="title">Search</h1><div class="search">⌕ <input id="searchinput" placeholder="Search people, Drops, hashtags..." autocomplete="off"></div><div class="tabs">${['Top','People','Posts','Hashtags'].map(t=>`<button class="pill ${searchTab===t?'on':''}" data-tab="${t}">${t}</button>`).join('')}</div><div id="results">${empty('⌕','Search something','Find people, Posts and hashtags. No suggested or fake accounts.')}</div>`);document.getElementById('searchinput').oninput=updateSearch}
function updateSearch(){let q=document.getElementById('searchinput').value.trim().toLowerCase(),box=document.getElementById('results');if(!q){box.innerHTML=empty('⌕','Search something','Find people, Posts and hashtags.');return}let ps=data.posts.filter(p=>p.caption.toLowerCase().includes(q));let tags=[...new Set(data.posts.flatMap(p=>p.caption.match(/#[\w]+/g)||[]))].filter(t=>t.toLowerCase().includes(q));let self=data.user.username.toLowerCase().includes(q)||data.user.name.toLowerCase().includes(q);let html='';if(['Top','People'].includes(searchTab)&&self)html+=`<div class="row"><div class="left">${avatar(38)}<div><strong>@${esc(data.user.username)}</strong><div class="small">Your profile</div></div></div></div>`;if(['Top','Posts'].includes(searchTab))html+=ps.map(p=>`<div class="row"><div><b>Drop</b><div class="small">${esc(p.caption.slice(0,90))}</div></div></div>`).join('');if(['Top','Hashtags'].includes(searchTab))html+=tags.map(t=>`<div class="row"><strong>${esc(t)}</strong></div>`).join('');box.innerHTML=html||empty('⌕','No results','Only content created in this browser is searchable.')}
function create(){tempMedia=null;shell(`${heading('Create a Post')}<h2 style="text-align:center;margin:35px 0 5px">Create a Post</h2><p class="sub" style="text-align:center">Share your moment with the world ♡</p><div class="card" style="padding:25px;text-align:center;background:#faf9fe"><div id="preview" style="min-height:140px;display:grid;place-items:center;color:#6d57ad;font-size:45px">▧</div><label class="primary" style="display:inline-block;margin-top:12px">Choose Photo or Video<input type="file" id="mediafile" accept="image/*,video/*" hidden></label></div><label>Caption<textarea id="caption" class="field textarea" maxlength="1500" placeholder="Write a caption... #vibe"></textarea></label><button class="primary" id="publish" style="width:100%">Share Post</button><p class="small">Stored in this browser only. For reliable testing, choose small files (under 3 MB).</p>`);document.getElementById('mediafile').onchange=e=>loadMedia(e.target.files[0],false);document.getElementById('publish').onclick=()=>{if(!tempMedia){notify('Choose a photo or video first');return}data.posts.unshift({id:Date.now(),media:tempMedia.data,type:tempMedia.type,caption:document.getElementById('caption').value.trim(),time:Date.now(),spark:false,keep:false,echoes:[],edited:false,echoEnabled:true});log('Published a Drop');save();notify('Post shared locally');go('home')}}
function loadMedia(file,story){if(!file)return;if(!/^image\/|^video\//.test(file.type)){notify('Choose an image or video');return}if(file.size>3*1024*1024){notify('Choose a file smaller than 3 MB for this offline demo');return}let reader=new FileReader();reader.onload=()=>{let obj={data:reader.result,type:file.type.startsWith('video')?'video':'image'};if(story)tempStory=obj;else tempMedia=obj;let box=document.getElementById('preview');if(box)box.innerHTML=obj.type==='video'?`<video class="postvideo" src="${obj.data}" controls playsinline></video>`:`<img class="postmedia" src="${obj.data}" alt="Preview">`};reader.readAsDataURL(file)}
function storycreate(){tempStory=null;shell(`${heading('Your Story')}<p class="sub">Stories expire automatically after your chosen duration.</p><div class="card" style="text-align:center"><div id="preview" style="min-height:160px;display:grid;place-items:center;font-size:55px;color:#8e7ac4">✦</div><label class="primary">Choose Story<input id="storyfile" type="file" accept="image/*,video/*" hidden></label></div><label>Duration<select class="field" id="storyhours">${['12','24','48'].map(v=>`<option ${data.prefs.storyHours===v?'selected':''} value="${v}">${v} hours</option>`).join('')}</select></label><button class="primary" id="shareStory">Share Story</button>`);document.getElementById('storyfile').onchange=e=>loadMedia(e.target.files[0],true);document.getElementById('shareStory').onclick=()=>{if(!tempStory)return notify('Choose a story first');let hours=+document.getElementById('storyhours').value;data.stories.unshift({...tempStory,id:Date.now(),expires:Date.now()+hours*3600000});save();notify('Story added locally');go('home')}}
function profile(){let p=data.user;shell(`<div class="top"><h1 class="title">Profile</h1><button class="iconbtn" data-go="settings">⚙</button></div><div class="profiletop">${avatar()}<strong style="font-size:18px">${esc(p.name)}</strong><span class="sub">@${esc(p.username)}</span><div>${esc(p.bio||'Your bio goes here')}</div></div><div class="stats"><div><strong>${data.posts.length}</strong><span>Drops</span></div><div><strong>0</strong><span>Followers</span></div><div><strong>0</strong><span>Following</span></div></div><button class="secondary" data-go="editprofile" style="width:100%">Edit Profile</button><div class="tabs" style="justify-content:space-around;margin-top:20px">${['Posts','Saved Posts','Highlights'].map(t=>`<button class="pill ${profileTab===t?'on':''}" data-profiletab="${t}">${t}</button>`).join('')}</div>${profileTab==='Posts'?(data.posts.length?data.posts.map(postCard).join(''):empty('▧','No Posts yet','Your posts will appear here.')):profileTab==='Saved Posts'?(data.posts.filter(p=>p.keep).length?data.posts.filter(p=>p.keep).map(postCard).join(''):empty('▢','No Saved Posts','Saved Drops are private to you.')):empty('✧','No Highlights yet','Story Highlights will appear here when implemented with Firebase.')}`)}
function editprofile(){shell(`${heading('Edit Profile')}<form id="profileform"><label>Display name<input name="name" class="field" maxlength="45" value="${esc(data.user.name)}" required></label><label>Username<input name="username" class="field" maxlength="25" pattern="[A-Za-z0-9_.]{3,25}" value="${esc(data.user.username)}" required></label><p class="small">Username can be changed once every 30 days.</p><label>Bio<textarea name="bio" class="field textarea" maxlength="150">${esc(data.user.bio)}</textarea></label><label>Profile photo<input name="photo" type="file" accept="image/*" class="field"></label><button class="primary">Save Changes</button></form>`);document.getElementById('profileform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),username=String(f.get('username'));if(username!==data.user.username&&data.user.usernameChanged&&Date.now()-data.user.usernameChanged<30*86400000)return notify('Username can be changed once every 30 days');if(username!==data.user.username)data.user.usernameChanged=Date.now();data.user.username=username;data.user.name=String(f.get('name'));data.user.bio=String(f.get('bio'));if(fbUser&&fb)fb.updateDoc(fb.doc(fb.db,'users',fbUser.uid),{name:data.user.name,username:data.user.username,bio:data.user.bio,usernameChanged:data.user.usernameChanged||null}).catch(err=>notify('Cloud profile update failed: '+err.message));let file=f.get('photo');if(file?.size){if(file.size>500000)return notify('Profile photo must be under 500 KB');let rd=new FileReader();rd.onload=()=>{data.user.photo=rd.result;save();go('profile')};rd.readAsDataURL(file)}else{save();go('profile')}}}
function inbox(){shell(`<h1 class="title">Inbox</h1><div class="tabs">${['Chats','Message Requests','Groups'].map(t=>`<button class="pill ${inboxTab===t?'on':''}" data-inboxtab="${t}">${t}</button>`).join('')}</div>${inboxTab==='Chats'?`<div class="card"><b>Notes to yourself</b><p class="small">A local chat for testing message editing and deletion.</p><button class="secondary" data-go="chat">Open Chat →</button></div>`:inboxTab==='Message Requests'?empty('✉','No message requests','Requests from other people will appear here after Firebase integration.'):empty('♧','No groups yet','Group invitations, roles and chats require a backend.')}<div class="notice">Chats are local demo data. Other accounts cannot message you yet.</div>`)}
function chat(){shell(`${heading('Notes to yourself')}<div class="notice">Private local testing chat — not connected to other users.</div><div style="min-height:45vh;padding:15px 0">${data.messages.map(m=>`<div class="chip"><div>${esc(m.text)} ${m.edited?'<span class="tiny">(Edited)</span>':''}</div><div class="small">${new Date(m.time).toLocaleTimeString()} <button class="link" data-action="editmessage" data-id="${m.id}">Edit</button><button class="link" data-action="deletemessage" data-id="${m.id}">Delete</button></div></div>`).join('')}</div><form id="msgform" style="display:flex;gap:8px"><input class="field" name="msg" maxlength="1000" placeholder="Type a message" required><button class="primary" style="align-self:start">Send</button></form>`);document.getElementById('msgform').onsubmit=e=>{e.preventDefault();let val=new FormData(e.target).get('msg').trim();if(!val)return;data.messages.push({id:Date.now(),text:val,time:Date.now(),edited:false});save();chat()}}
function notifications(){shell(`${heading('Notifications')}<div class="tabs"><button class="pill on">All</button></div>${data.notifications.length?data.notifications.map(n=>`<div class="row">${esc(n)}</div>`).join(''):empty('♧','All caught up','Follow requests, Sparks, Echoes and other notifications will appear here when connected.')}`)}
const sections=[['Account','♙','Account'],['Privacy & Safety','♧','Privacy & Safety'],['Messages & Groups','✉','Messages & Groups'],['Notifications','♢','Notifications'],['Your Activity','◷','Your Activity'],['Time Management','◴','Time Management'],['Content Preferences','▤','Content Preferences'],['Stories & Highlights','✧','Stories & Highlights'],['Security','⌑','Security'],['Appearance','◐','Appearance'],['Help & Support','?','Help & Support'],['About Vibe by Summer Soni','ⓘ','About Vibe by Summer Soni']];
function settings(){shell(`${heading('Settings')}<div class="row" data-go="editprofile"><div class="left">${avatar(48)}<div><strong>${esc(data.user.name)}</strong><div class="small">@${esc(data.user.username)}</div></div></div><span class="chev">›</span></div>${sections.map(([s,i])=>`<div class="row" data-setting="${esc(s)}"><div class="left"><span class="sym">${i}</span><span class="label">${s}</span></div><span class="chev">›</span></div>`).join('')}<button class="secondary" style="width:100%;margin-top:25px" data-action="logout">Log Out</button>`)}
function settingRow(label,key,desc=''){return `<div class="row"><div><div class="label">${label}</div>${desc?`<div class="desc">${desc}</div>`:''}</div><input class="toggle" type="checkbox" data-pref="${key}" ${data.prefs[key]?'checked':''}></div>`}
function choice(label,key,options){return `<div class="row"><div class="label">${label}</div><select class="field" style="width:auto;max-width:53%;margin:0" data-choice="${key}">${options.map(v=>`<option value="${esc(v)}" ${data.prefs[key]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`}
function item(label,desc='',action='soon'){return `<div class="row" data-action="${action}"><div><div class="label">${label}</div>${desc?`<div class="desc">${desc}</div>`:''}</div><span class="chev">›</span></div>`}
function settingsPage(s){let h=heading(s);switch(s){case'Account':h+=item('Edit profile','','editprofile')+item('Email & personal details',data.user.email)+item('Change username','Once every 30 days','editprofile')+item('Account type','Personal account')+item('Deactivate account','Requires secure backend')+item('Delete account','30-day cancellation period requires Firebase');break;case'Privacy & Safety':h+=settingRow('Private account','private','Only approved followers can see private content once Firebase rules are configured')+choice('Who can mention you','mentions',['Everyone','Followers','Nobody'])+choice('Who can tag you','tags',['Everyone','Followers','Nobody'])+item('Blocked accounts','None in this demo')+item('Restricted accounts','None in this demo')+item('Close Friends','Manage story audience')+item('Hidden words','Configure in Content Preferences');break;case'Messages & Groups':h+=choice('Who can message you','messages',['Everyone','Followers','Nobody'])+choice('Who can invite you to groups','groupInvites',['Everyone','Followers','Nobody'])+settingRow('Read receipts','readReceipts')+settingRow('Activity status','activity')+item('Message requests','Review requests','inbox')+item('Group roles & ownership','Backend required');break;case'Notifications':h+=settingRow('Enable notifications','notifications','In-app demo preference')+settingRow('Quiet hours','quiet')+settingRow('Hide message previews','hidePreview')+item('Follow requests & followers')+item('Sparks, Echoes & Drops')+item('Stories & Highlights')+item('Messages & group invitations');break;case'Your Activity':h+=item('Your Posts',`${data.posts.length} created`,'profile')+item('Your Comments')+item('Your Likes')+item('Search history',`${data.searches.length} searches`)+item('Recently deleted','Backend retention required')+`<div class="section">Local activity log</div>${data.history.map(x=>`<div class="row"><div>${esc(x.text)}<div class="small">${new Date(x.time).toLocaleString()}</div></div></div>`).join('')||'<p class="small">No activity yet</p>'}`;break;case'Time Management':h+=settingRow('Quiet mode','quiet')+item('Daily time reminder','Not active in this testing build')+item('Break reminders','Not active in this testing build');break;case'Content Preferences':h+=choice('Sensitive content','sensitive',['Less','Standard'])+`<label>Hidden words<textarea id="hiddenwords" class="field textarea" placeholder="Comma-separated words">${esc(data.prefs.hiddenWords)}</textarea></label><button class="secondary" id="savewords">Save hidden words</button>`+item('Muted accounts','None yet')+item('Suggested content','Recommendations require backend');break;case'Stories & Highlights':h+=choice('Story audience','storyAudience',['Everyone','Followers','Close Friends'])+choice('Story duration','storyHours',['12','24','48'])+item('Close Friends','Manage list')+item('Highlight visibility','Requires story archive backend');break;case'Security':h+=item('Change password','Requires Firebase Auth')+settingRow('Two-factor authentication','twoFactor','Preview toggle only — not real protection')+item('Login activity','Device sessions require Firebase')+item('Log out of other devices','Requires Firebase');break;case'Appearance':h+=choice('Profile theme','theme',['Minimal Light','Pastel Dream','Midnight','Sunset'])+`<div class="notice">App stays in the approved white theme. Profile themes are saved as preferences only in this demo.</div>`;break;case'Help & Support':h+=item('Report a problem','Support service not connected')+item('Help Center','Coming with production backend')+item('Account status','No live moderation service')+item('Community guidelines','Be respectful and keep content age-appropriate');break;case'About Vibe by Summer Soni':h+=`<div class="card"><div class="brand">Vibe by Summer Soni<span>✦</span></div><p>Local testing build • v0.1</p><p class="small">This is a frontend prototype. Firebase is not connected. No cloud account, real chat, or secure private content is provided yet.</p></div>`+item('Privacy policy','To be written before release')+item('Terms of service','To be written before release');break}shell(h);let w=document.getElementById('savewords');if(w)w.onclick=()=>{data.prefs.hiddenWords=document.getElementById('hiddenwords').value;save();notify('Saved locally')}}
function modal(title,html){let m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet"><button class="iconbtn" style="float:right" data-close="1">×</button><h3>${title}</h3>${html}</div>`;document.body.append(m);m.onclick=e=>{if(e.target===m||e.target.closest('[data-close]'))m.remove()};return m}
function action(a,id,eid){let p=data.posts.find(x=>String(x.id)===String(id));if(a==='spark'||a==='keep'){if(!p)return;p[a==='spark'?'spark':'keep']=!p[a==='spark'?'spark':'keep'];save();render()}else if(a==='echo'){if(!p)return;if(!p.echoEnabled)return notify('Comments disabled for this Drop');let m=modal('Write a Comment',`<form id="echoform"><input class="field" name="echo" maxlength="500" required placeholder="Your Comment"><button class="primary">Post Comment</button></form>`);m.querySelector('form').onsubmit=e=>{e.preventDefault();let v=new FormData(e.target).get('echo').trim();if(v){p.echoes.push({id:Date.now(),text:v});save();m.remove();render()}}}else if(a==='deleteecho'){if(confirm('Delete this Echo?')){p.echoes=p.echoes.filter(x=>String(x.id)!==String(eid));save();render()}}else if(a==='postmenu'){let m=modal('Manage Post',`<button class="secondary" id="editpost">Edit caption</button> <button class="secondary" id="toggleecho">${p.echoEnabled?'Disable':'Enable'} Echoes</button><p><button class="secondary danger" id="delpost">Delete Post</button></p>`);m.querySelector('#editpost').onclick=()=>{m.remove();let n=modal('Edit Post',`<textarea id="newcaption" class="field textarea" maxlength="1500">${esc(p.caption)}</textarea><button class="primary" id="savecaption">Save</button>`);n.querySelector('#savecaption').onclick=()=>{p.caption=n.querySelector('#newcaption').value;p.edited=true;save();n.remove();render()}};m.querySelector('#toggleecho').onclick=()=>{p.echoEnabled=!p.echoEnabled;save();m.remove();render()};m.querySelector('#delpost').onclick=()=>{if(confirm('Delete this Drop?')){data.posts=data.posts.filter(x=>x.id!==p.id);save();m.remove();render()}}}else if(a==='editmessage'){let msg=data.messages.find(x=>String(x.id)===String(id));let v=prompt('Edit message',msg.text);if(v!==null&&v.trim()){msg.text=v.trim();msg.edited=true;save();chat()}}else if(a==='deletemessage'){if(confirm('Delete this local message?')){data.messages=data.messages.filter(x=>String(x.id)!==String(id));save();chat()}}else if(a==='logout'){if(fb)fb.signOut(fb.auth).catch(err=>notify(err.message))}else if(a==='editprofile')go('editprofile');else if(a==='profile')go('profile');else if(a==='inbox')go('inbox');else notify('This setting needs Firebase/backend integration')}
function bind(){app.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));app.querySelectorAll('[data-back]').forEach(x=>x.onclick=()=>go(['settings','editprofile','chat','notifications','storycreate'].includes(route)?route==='editprofile'?'profile':route==='chat'?'inbox':route==='setting'?'settings':'home':'settings'));app.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{searchTab=x.dataset.tab;let q=document.getElementById('searchinput')?.value||'';search();document.getElementById('searchinput').value=q;updateSearch()});app.querySelectorAll('[data-profiletab]').forEach(x=>x.onclick=()=>{profileTab=x.dataset.profiletab;profile()});app.querySelectorAll('[data-inboxtab]').forEach(x=>x.onclick=()=>{inboxTab=x.dataset.inboxtab;inbox()});app.querySelectorAll('[data-setting]').forEach(x=>x.onclick=()=>{sub=x.dataset.setting;go('setting',sub)});app.querySelectorAll('[data-pref]').forEach(x=>x.onchange=()=>{data.prefs[x.dataset.pref]=x.checked;save();notify('Preference saved locally')});app.querySelectorAll('[data-choice]').forEach(x=>x.onchange=()=>{data.prefs[x.dataset.choice]=x.value;save();notify('Preference saved locally')});app.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>action(x.dataset.action,x.dataset.id,x.dataset.eid));app.querySelectorAll('[data-story]').forEach(x=>x.onclick=()=>{let s=data.stories.find(v=>String(v.id)===x.dataset.story);if(!s)return;let m=modal('Your Story',`${s.type==='video'?`<video class="postvideo" src="${s.data}" controls autoplay playsinline></video>`:`<img class="postmedia" src="${s.data}">`}<p class="small">Expires ${new Date(s.expires).toLocaleString()}</p><button class="secondary danger" id="delstory">Delete Story</button>`);m.querySelector('#delstory').onclick=()=>{data.stories=data.stories.filter(z=>z.id!==s.id);save();m.remove();home()}})}
function render(){if(!data.user||!sessionActive)return auth();if(route==='home')home();else if(route==='search')search();else if(route==='create')create();else if(route==='profile')profile();else if(route==='editprofile')editprofile();else if(route==='inbox')inbox();else if(route==='chat')chat();else if(route==='notifications')notifications();else if(route==='settings')settings();else if(route==='setting')settingsPage(sub);else if(route==='storycreate')storycreate();else home()}
async function startFirebase(){app.innerHTML='<div class="auth"><div class="brand">Vibe by Summer Soni</div><p>Connecting securely…</p></div>';try{
const [appSdk,authSdk,dbSdk]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js')]);
const firebaseApp=appSdk.initializeApp(firebaseConfig);
fb={auth:authSdk.getAuth(firebaseApp),db:dbSdk.getFirestore(firebaseApp),createUserWithEmailAndPassword:authSdk.createUserWithEmailAndPassword,signInWithEmailAndPassword:authSdk.signInWithEmailAndPassword,signOut:authSdk.signOut,doc:dbSdk.doc,getDoc:dbSdk.getDoc,setDoc:dbSdk.setDoc,updateDoc:dbSdk.updateDoc,serverTimestamp:dbSdk.serverTimestamp};
authSdk.onAuthStateChanged(fb.auth,async u=>{fbUser=u;sessionActive=!!u;if(!u){data=structuredClone(initial);auth();return}try{let snap=await fb.getDoc(fb.doc(fb.db,'users',u.uid));for(let i=0;i<5&&!snap.exists();i++){await new Promise(r=>setTimeout(r,600));snap=await fb.getDoc(fb.doc(fb.db,'users',u.uid))}if(!snap.exists()){notify('Profile missing in Firestore. Check security rules.');await fb.signOut(fb.auth);return}let profile=snap.data(),stored;try{stored=JSON.parse(localStorage.getItem(KEY+'_'+u.uid))}catch{}data={...structuredClone(initial),...(stored||{})};data.user={name:profile.name||'',username:profile.username||'',email:u.email,bio:profile.bio||'',photo:data.user?.photo||null,joined:Date.now(),usernameChanged:profile.usernameChanged||0};data.prefs={...initial.prefs,...data.prefs};route='home';render()}catch(err){notify('Cannot load profile: '+err.message);app.innerHTML='<div class="auth"><h2>Could not load profile</h2><p>Check Firestore rules, then refresh.</p><button class="primary" onclick="location.reload()">Retry</button></div>'}});
}catch(err){app.innerHTML='<div class="auth"><h2>Firebase connection failed</h2><p>Check internet access and reload the page.</p><button class="primary" onclick="location.reload()">Retry</button></div>';console.error(err)}}
startFirebase();
</script></body></html>
