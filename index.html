<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf8"><title>vibe • demo</title><style>
:root{--bg:#fffaf8;--card:#fff;--ink:#252334;--muted:#827d8c;--line:#f1e9ec;--accent:#fa6b83;--second:#9a83ed;--mint:#b5eee0;--shadow:0 10px 32px #442a4710}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Arial}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--second)}.app{max-width:540px;margin:auto;min-height:100dvh}.top{position:sticky;top:0;z-index:9;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(15px);display:flex;align-items:center;justify-content:space-between;padding:14px 17px;border-bottom:1px solid var(--line)}.logo{font-weight:950;font-size:30px;letter-spacing:-2px;background:linear-gradient(100deg,#fa6485,#a08bf1);background-clip:text;color:transparent}.chip,.icon{border:0;background:#f8eff4;border-radius:99px;padding:9px 12px;color:var(--ink)}.icon{min-width:40px}.main{padding:16px 15px 100px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:540px;width:100%;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:15;justify-content:space-around}.nav button{background:none;border:0;color:var(--muted);font-size:11px;display:grid;gap:4px;justify-items:center;min-width:56px}.nav button span{font-size:22px}.nav button.on{color:var(--accent);font-weight:800}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);margin-bottom:15px;overflow:hidden}.pad{padding:16px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.muted{color:var(--muted);font-size:12px}.avatar{height:42px;width:42px;border-radius:50%;background:linear-gradient(135deg,#ffc3ae,#b6a5ff);display:grid;place-items:center;font-size:23px;flex-shrink:0}.stories{display:flex;gap:13px;overflow-x:auto;padding:7px 2px 17px;scrollbar-width:none}.story{border:0;background:none;min-width:66px;text-align:center;font-size:11px;color:var(--ink)}.story .avatar{margin:auto auto 5px;border:3px solid #f88b9d;width:62px;height:62px}.art{position:relative;aspect-ratio:4/4.1;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,var(--c1),var(--c2));text-align:center}.art:before{content:"";position:absolute;width:260px;height:260px;border-radius:45%;background:#ffffff33;top:-100px;right:-80px;transform:rotate(28deg)}.art:after{content:"";position:absolute;width:200px;height:200px;border:2px solid #ffffff77;border-radius:50%;bottom:-110px;left:-60px}.art .emoji{font-size:100px;filter:drop-shadow(0 18px 12px #2e234122);z-index:1}.art .arttitle{position:absolute;bottom:24px;left:20px;right:20px;color:#30263b;font-size:22px;font-weight:900;z-index:1;text-shadow:0 1px 10px #ffffffbb}.reelbadge,.demobadge{position:absolute;top:13px;left:13px;background:#ffffffdd;border-radius:40px;padding:6px 10px;font-size:11px;font-weight:800;z-index:2}.reelbadge{left:auto;right:13px}.actions{display:flex;justify-content:space-between;padding:12px}.actions button{background:none;border:0;color:var(--ink);font-size:13px;padding:8px 4px}.actions button.active{color:var(--accent)}.caption{padding:0 16px 16px;line-height:1.5}.btn{border:0;border-radius:14px;padding:12px 17px;background:linear-gradient(115deg,#fa6b83,#b18cf3);color:white;font-weight:750}.btn.secondary{background:#f7eef3;color:var(--ink)}.btn.small{padding:8px 12px;font-size:12px}.field{display:block;width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px;color:var(--ink);margin:9px 0 13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.tiles .art{aspect-ratio:1/1.2;cursor:pointer}.tabs{display:flex;gap:8px;overflow:auto;padding:5px 0 15px}.tabs button{white-space:nowrap;border:0;border-radius:99px;padding:10px 14px;background:#f5edf2;color:var(--ink)}.tabs .selected{background:var(--ink);color:white}.section{font-size:20px;font-weight:850;margin:8px 0 14px}.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item .grow{flex:1;min-width:0}.item strong{display:block}.notice{padding:12px;background:#fff0d8;border-radius:12px;font-size:12px;margin:12px 0}.modalwrap{position:fixed;inset:0;background:#201b29a3;display:flex;align-items:end;justify-content:center;z-index:30}.modal{background:var(--card);color:var(--ink);border-radius:24px 24px 0 0;width:min(540px,100%);max-height:91dvh;overflow:auto;padding:18px 18px 30px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modalhead h2{margin:0}.welcome{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 18%,#ffe4e9,transparent 40%),radial-gradient(circle at 90% 80%,#ded3ff,transparent 42%),#fffaf8}.welcome .logo{font-size:82px}.welcome .card{padding:30px;text-align:center;width:100%}.welcome .btn{width:100%;margin:6px 0}.hero{font-size:62px;margin:12px}.chatbox{height:48dvh;overflow:auto;padding:12px;background:#f9f5f7;border-radius:17px}.bubble{max-width:85%;background:white;border-radius:16px;padding:10px 13px;margin:9px 0}.bubble.me{margin-left:auto;background:#fbd4df}.reelview{height:72dvh;border-radius:20px;position:relative;overflow:hidden}.reelview .art{height:100%;aspect-ratio:auto}.reelcontrols{position:absolute;bottom:15px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;z-index:3}.reelcontrols button{border:0;background:#ffffffd9;border-radius:50%;padding:10px}.progress{height:4px;background:#ffffff77;position:absolute;bottom:4px;left:8px;right:8px;z-index:3}.progress i{display:block;background:white;height:100%;width:30%}.theme-midnight{--bg:#161725;--card:#232437;--ink:#f7f5ff;--muted:#b4adc6;--line:#3c3a4c;--shadow:none}.theme-sunset{--bg:#fff1e9;--card:#fff9f5;--accent:#ee7854}.theme-pastel{--bg:#f5f0ff;--card:#fffaff;--accent:#a778d5}.hidden{display:none!important}h1,h2,h3,p{overflow-wrap:anywhere}small{color:var(--muted)}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#30273c;color:white;border-radius:14px;padding:12px 17px;z-index:50;width:max-content;max-width:90%;font-size:13px}.empty{text-align:center;padding:38px 15px;color:var(--muted)}
</style></head><body><div id="app" class="app"></div><div id="overlay"></div><script>
'use strict';
const KEY='vibe-demo-v1';const cats=['Lifestyle','Art','Pets','Food','Travel','Hobbies','Sports','Education','Fashion','Entertainment'];const icons=['🌸','🎨','🐈','🍓','🏝️','🪴','🏀','📚','🧢','🎧'];const colors=[['#ffe0e3','#d6c7ff'],['#c8edee','#c6b6ff'],['#ffddb5','#ffc0cf'],['#c8f0d7','#ffe5b3'],['#d4d9ff','#ffd4db']];const names=['Luna Sketch','Nova Bloom','Milo Moon','Sunny Studio','Ari Pixel','Kai Meadow','Zoe Cloud','River Doodle','Echo Day','Pip Dream'];const posts=Array.from({length:100},(_,i)=>({id:i+1,kind:i<70?'reel':'photo',category:cats[i%10],emoji:icons[i%10],title:['Little moments, big energy','A colorful day','Made with imagination','Today feels magical','A tiny adventure'][i%5],user:names[i%10],caption:`${cats[i%10]} inspiration • fictional demo Drop #${i+1} #${cats[i%10].toLowerCase()} #vibe`,color:colors[i%5],time:'Demo sample'}));
const fresh=()=>({entered:false,account:false,name:'Your Vibe',username:'myvibe',bio:'Creating my own vibe ✨',private:true,theme:'minimal',sparks:[],keeps:[],echoes:{},own:[],stories:[],highlights:[],links:[],close:[],requests:[],blocked:[],restricted:[],muted:[],groups:[{id:1,name:'Creative Corner',description:'A fictional demo group',members:['You','Luna Sketch'],admins:['You'],owner:'You'}],chats:{},notifications:[{text:'Welcome to your private Vibe demo!',read:false}],settings:{message:'Links Only',invite:'Links Only',previews:true,quiet:false},history:[]});let state;try{state=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{state=fresh()}let page='Home',modal='',exploreTab='For You',searchTab='Top',query='',msgTab='Chats',notifTab='All',profileTab='Drops',reelIndex=0,reelPlaying=false,reelProgress=0,reelTimer=null,chatWith='',botWith='',storyIndex=0;const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('Storage full; some changes cannot be saved')}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=s=>{document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),2600)};const avatar=(name)=>`<span class="avatar">${esc(name==='You'?'🌷':icons[Math.max(0,names.indexOf(name))%10])}</span>`;const art=(p)=>`<div class="art" style="--c1:${p.color[0]};--c2:${p.color[1]}"><span class="demobadge">FICTIONAL DEMO</span>${p.kind==='reel'?'<span class="reelbadge">▶ REEL PREVIEW</span>':''}<span class="emoji">${p.emoji}</span><span class="arttitle">${esc(p.title)}</span></div>`;const all=()=>[...state.own,...posts];const getPost=id=>all().find(p=>String(p.id)===String(id));const btn=(label,act,cls='secondary')=>`<button class="btn ${cls}" data-act="${act}">${label}</button>`;const navs=['Home','Explore','Create','Messages','Profile'];const headerUI=()=>`<header class="top"><div class="logo">vibe<span style="font-size:11px;letter-spacing:0;color:var(--muted)"> demo</span></div><div class="row"><button class="icon" data-act="notifications" aria-label="Notifications">🔔</button><button class="icon" data-act="settings" aria-label="Settings">⚙️</button></div></header>`;const nav=()=>`<nav class="nav" aria-label="Main navigation">${navs.map((n,i)=>`<button data-page="${n}" class="${page===n?'on':''}"><span>${['⌂','⌕','⊕','✉','◉'][i]}</span>${n}</button>`).join('')}</nav>`;function render(){document.body.className=state.theme==='minimal'?'':`theme-${state.theme}`;if(!state.entered){$('app').innerHTML=`<div class="welcome"><div class="card"><div class="hero">🌷✨</div><div class="logo">vibe</div><h2>Find your kind of magic.</h2><p class="muted">A colorful, private-first social playground.</p><div class="notice">LOCAL DEMO • No real accounts or cloud messaging</div><button class="btn" data-act="login">Login</button><button class="btn secondary" data-act="signup">Sign Up</button></div></div>`;return}let content=({Home:home,Explore:explore,Create:create,Messages:messages,Profile:profile,Notifications:notifications,Settings:settings,'Close Friends':closeFriends,Groups:groups,Guide:guide,'Vibe Req':vibeReq,'Blocked Accounts':blockedScreen,'Restricted Accounts':restrictedScreen,'Search History':historyScreen,'Activity History':historyScreen,'Account Changes History':historyScreen,'Password and Security':security,'Login History':security,'Message Settings':messageSettings,'Account Privacy':privacy,'Edit Profile':editProfile})[page];$('app').innerHTML=headerUI()+`<main class="main">${content?content():'<p>Screen unavailable</p>'}</main>`+nav()}
function home(){return `<div class="row between"><h2 class="section">Your daily vibe ✨</h2><button class="chip" data-act="reels">▶ Reels</button></div><div class="stories"><button class="story" data-act="addstory">${avatar('You')}+ Your Story</button>${names.slice(0,8).map((n,i)=>`<button class="story" data-act="viewstory:${i}">${avatar(n)}${esc(n.split(' ')[0])}${i===1?' 💚':''}</button>`).join('')}</div><div class="notice">100 fictional Drops: 70 illustrated reel previews + 30 illustrated photos. No actual video or live feed.</div>${all().map(dropCard).join('')}<div class="card pad"><h3>Suggested demo creators</h3>${names.slice(0,4).map(accountRow).join('')}</div>`}
function dropCard(p){let spark=state.sparks.includes(p.id),keep=state.keeps.includes(p.id);return `<article class="card"><div class="pad row between"><div class="row">${avatar(p.user)}<div><strong>${esc(p.user)}</strong><div class="muted">${p.time||'Fictional demo account'} · ${p.kind==='reel'?'Reel preview':'Photo'}</div></div></div><button class="icon" data-act="options:${p.id}" aria-label="Drop options">⋯</button></div><div data-act="${p.kind==='reel'?'openreel:':'openpost:'}${p.id}" role="button" tabindex="0">${art(p)}</div><div class="actions"><button class="${spark?'active':''}" data-act="spark:${p.id}">💗 ${spark?'1':'0'} Sparks</button><button data-act="echo:${p.id}">💬 ${(state.echoes[p.id]||[]).length} Echoes</button><button data-act="share:${p.id}">↗ Share</button><button class="${keep?'active':''}" data-act="keep:${p.id}">🔖 Keep</button></div><div class="caption">${esc(p.caption)} ${p.edited?'<small>Edited</small>':''}</div></article>`}
function explore(){let q=query.toLowerCase();let filtered=all().filter(p=>!p.hidden&&(!q||[p.caption,p.user,p.category,p.title].join(' ').toLowerCase().includes(q)));return `<h2 class="section">Explore wonder ✨</h2><input id="search" class="field" placeholder="Search people, Drops, hashtags, groups" value="${esc(query)}"><div class="tabs">${['For You','Trending','New Creators','Hashtags'].map(t=>`<button data-act="exploretab:${t}" class="${exploreTab===t?'selected':''}">${t}</button>`).join('')}</div><div class="tabs">${['Top','People','Drops','Hashtags','Groups'].map(t=>`<button data-act="searchtab:${t}" class="${searchTab===t?'selected':''}">${t}</button>`).join('')}</div>${searchTab==='People'?names.filter(n=>n.toLowerCase().includes(q)).map(accountRow).join('')||'<div class="empty">No demo people found</div>':searchTab==='Groups'?state.groups.filter(g=>g.name.toLowerCase().includes(q)&&g.discoverable!==false).map(g=>`<div class="item">🫧 ${esc(g.name)} ${btn('Open','group:'+g.id,'small')}</div>`).join('')||'<div class="empty">No groups found</div>':searchTab==='Hashtags'?cats.filter(c=>c.toLowerCase().includes(q.replace('#',''))).map(c=>`<button class="chip" data-act="hashtag:${c}">#${c.toLowerCase()}</button>`).join(' '):`<div class="tiles">${filtered.map(p=>`<div data-act="${p.kind==='reel'?'openreel:':'openpost:'}${p.id}">${art(p)}</div>`).join('')}</div>`}`}
function create(){return `<h2 class="section">Create a Drop 🌈</h2><div class="card pad"><label>Caption<textarea id="newcaption" class="field" maxlength="600" rows="4" placeholder="What’s your vibe today?"></textarea></label><label>Category<select id="newcategory" class="field">${cats.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Format<select id="newkind" class="field"><option value="photo">Illustrated photo Drop</option><option value="reel">Illustrated reel preview</option></select></label><label>Audience<select id="newaudience" class="field"><option>Only Me</option><option>Close Friends</option><option>Vibe Circle</option><option>Everyone (local preview only)</option></select></label><button class="btn" data-act="previewdrop">Preview Drop</button></div><div class="notice">Created Drops are saved only on this browser. No files are uploaded to a server.</div>${btn('Create Story','addstory')}`}
function profile(){let mine=state.own;return `<div class="card pad"><div class="row">${avatar('You')}<div><h2 style="margin:0">${esc(state.name)}</h2><small>@${esc(state.username)} · ${state.private?'🔒 Private':'🌍 Public demo'}</small></div></div><p>${esc(state.bio)}</p><div class="row between"><div><b>${mine.length}</b><small> Drops</small></div><div><b>${state.links.length}</b><small> Links</small></div><div><b>${state.links.length}</b><small> Linked</small></div></div><div class="row" style="margin-top:16px">${btn('Edit Profile','editprofile','small')}${btn('Share Profile','shareprofile','small')}</div></div><div class="row between"><h3>Highlights</h3>${btn('+ New','newhighlight','small')}</div><div class="stories">${state.highlights.map((h,i)=>`<button class="story" data-act="highlight:${i}"><span class="avatar">${esc(h.cover)}</span>${esc(h.name)}</button>`).join('')||'<small>No highlights yet</small>'}</div><div class="tabs">${['Drops','Keepsakes'].map(t=>`<button class="${profileTab===t?'selected':''}" data-act="profiletab:${t}">${t}</button>`).join('')}</div>${profileTab==='Drops'?(mine.map(dropCard).join('')||'<div class="empty">No Drops yet. Create your first one!</div>'):(state.keeps.map(getPost).filter(Boolean).map(dropCard).join('')||'<div class="empty">Your private Keepsakes appear here.</div>')}`}
function messages(){return `<h2 class="section">Message Box 💌</h2><div class="notice">All chats are fictional/local demo conversations. No real-time delivery.</div><div class="tabs">${['Chats','Message Requests','Groups'].map(t=>`<button class="${msgTab===t?'selected':''}" data-act="msgtab:${t}">${t}</button>`).join('')}</div>${msgTab==='Chats'?`<div class="card pad"><h3>Demo assistants</h3>${['Vibe Guide','Study Buddy','Creative Buddy','Discovery Bot','Fun Bot'].map(b=>`<div class="item">${avatar(b)}<div class="grow"><strong>${b}</strong><small>Scripted demo bot</small></div>${btn('Chat','bot:'+b,'small')}</div>`).join('')}</div><div class="card pad"><h3>Fictional chats</h3>${names.slice(0,5).map(n=>`<div class="item">${avatar(n)}<div class="grow"><strong>${n}</strong><small>Local demo messages</small></div>${btn('Open','chat:'+n,'small')}</div>`).join('')}</div>`:msgTab==='Message Requests'?`<div class="card pad"><h3>Requests</h3><p class="muted">No pending message requests. This is a local preview.</p>${btn('Message permissions','messagesettings')}</div>`:`${btn('New Group','newgroup')}<div class="card pad">${state.groups.map(g=>`<div class="item"><div class="grow"><strong>${esc(g.name)}</strong><small>${g.members.length} demo members</small></div>${btn('Open','group:'+g.id,'small')}</div>`).join('')}</div>`}`}
function notifications(){let categories=['All','Links and Vibe Req','Drops','Echoes','Sparks','Stories and Highlights','Account and Safety'];return `<h2 class="section">Notifications 🔔</h2><div class="notice">In-app demo notices only. No push notifications.</div><div class="tabs">${categories.map(t=>`<button class="${notifTab===t?'selected':''}" data-act="notiftab:${t}">${t}</button>`).join('')}</div>${btn('Mark all as read','readall')}<div class="card pad">${(notifTab==='All'?state.notifications:state.notifications.filter(n=>n.category===notifTab)).map(n=>`<div class="item">${n.read?'✓':'🔔'} <div>${esc(n.text)}</div></div>`).join('')||'<div class="empty">Nothing here yet</div>'}</div>`}
function settings(){return `<h2 class="section">Settings ⚙️</h2><div class="card pad"><h3>Appearance</h3><select id="theme" class="field"><option value="minimal">Minimal Light (default)</option><option value="pastel">Pastel Dream</option><option value="midnight">Midnight</option><option value="sunset">Sunset</option></select></div><div class="card pad">${['Edit Profile','Account Privacy','Close Friends','Notifications','Message Settings','Blocked Accounts','Restricted Accounts','Password and Security','Login History','Search History','Activity History','Account Changes History'].map(t=>`<div class="item between"><span>${t}</span><button class="chip" data-act="goto:${t}">Open →</button></div>`).join('')}</div><div class="card pad"><h3>Demo account controls</h3>${btn('Clear eligible local history','clearhistory')} ${btn('Sign Out','signout')}<p>${btn('Deactivate demo profile','deactivate')}</p>${btn('Delete local demo data','deleteaccount')}</div>`}
function privacy(){return `<h2>Account Privacy</h2><div class="card pad"><label class="row between">Private account <input id="private" type="checkbox" ${state.private?'checked':''}></label><p class="muted">Private by default. This switch affects only local demo presentation; it does not enforce cloud access.</p></div>`}
function closeFriends(){return `<h2>Close Friends 💚</h2><p class="muted">Local audience preview</p><div class="card pad">${names.map(n=>`<div class="item">${avatar(n)}<div class="grow">${n}</div><button class="chip" data-act="close:${n}">${state.close.includes(n)?'Remove':'Add'}</button></div>`).join('')}</div>`}
function accountRow(n){return `<div class="item">${avatar(n)}<div class="grow"><strong>${esc(n)}</strong><small>Fictional demo creator</small></div><button class="chip" data-act="link:${n}">${state.links.includes(n)?'Remove Link':'Link Up'}</button></div>`}
function vibeReq(){return `<h2>Vibe Req</h2><div class="card pad"><p class="muted">No real incoming requests in this offline demo.</p></div>`}
function blockedScreen(){return `<h2>Blocked Accounts</h2><div class="card pad">${names.map(n=>`<div class="item between">${esc(n)} <button class="chip" data-act="block:${n}">${state.blocked.includes(n)?'Unblock':'Block'}</button></div>`).join('')}</div>`}
function restrictedScreen(){return `<h2>Restricted Accounts</h2><div class="card pad">${names.map(n=>`<div class="item between">${esc(n)} <button class="chip" data-act="restrict:${n}">${state.restricted.includes(n)?'Unrestrict':'Restrict'}</button></div>`).join('')}</div>`}
function historyScreen(){return `<h2>${page}</h2><div class="card pad">${state.history.map(x=>`<div class="item">${esc(x)}</div>`).join('')||'<div class="empty">No local activity saved</div>'}</div>${btn('Clear local history','clearhistory')}`}
function security(){return `<h2>${page}</h2><div class="notice">Unavailable in offline demo. Secure passwords, verified login history and account deletion require backend authentication and server-side records.</div>`}
function messageSettings(){return `<h2>Message Settings</h2><div class="card pad"><label>Who can message?<select id="messageperm" class="field"><option>Links Only</option><option>Anyone</option></select></label><label>Group invitations<select id="inviteperm" class="field"><option>Links Only</option><option>Everyone</option><option>Nobody</option></select></label><label><input id="previews" type="checkbox"> Show message previews</label><p><label><input id="quiet" type="checkbox"> Quiet Hours (demo toggle)</label></p></div>`}
function editProfile(){return `<h2>Edit Profile</h2><div class="card pad"><label>Display name<input id="editname" class="field" maxlength="50" value="${esc(state.name)}"></label><label>Username<input id="edituser" class="field" maxlength="25" value="${esc(state.username)}"></label><label>Bio (max 150 characters)<textarea id="editbio" class="field" maxlength="150">${esc(state.bio)}</textarea></label>${btn('Save local profile','saveprofile')}<p class="muted">Avatar upload/crop and globally unique usernames require additional implementation and backend checks.</p></div>`}
function groups(){return `<h2>Groups</h2>${state.groups.map(g=>`<div class="card pad"><h3>${esc(g.name)}</h3><p>${esc(g.description)}</p><p>${g.members.map(esc).join(', ')}</p>${btn('Open','group:'+g.id)}</div>`).join('')}`}
function guide(){return `<h2>Vibe Guide</h2>${btn('Open scripted guide','bot:Vibe Guide')}`}
function openModal(title,body){modal=title;$('overlay').innerHTML=`<div class="modalwrap"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><h2>${esc(title)}</h2><button class="icon" data-act="closemodal" aria-label="Close">✕</button></div>${body}</section></div>`}
function closeModal(){modal='';$('overlay').innerHTML='';clearInterval(reelTimer)}
function showEcho(id){let p=getPost(id);if(!p)return;openModal('Echoes · '+p.user,`<div class="notice">Demo Echoes saved on this device.</div><div>${(state.echoes[id]||[]).map((e,i)=>`<div class="item"><div class="grow"><b>${esc(e.user)}</b><p>${esc(e.text)} ${e.edited?'<small>Edited</small>':''}</p></div>${e.user==='You'?`<button class="chip" data-act="editecho:${id}:${i}">Edit</button>`:''}<button class="chip" data-act="delecho:${id}:${i}">Delete</button></div>`).join('')||'<div class="empty">Be the first to Echo</div>'}</div>${p.echoOff?'<p>Echoes disabled by Drop owner.</p>':`<textarea id="echotext" class="field" placeholder="Write an Echo" maxlength="300"></textarea>${btn('Send Echo','sendecho:'+id)}`}`)}
function showReel(id){let reels=all().filter(p=>p.kind==='reel');reelIndex=Math.max(0,reels.findIndex(p=>String(p.id)===String(id)));reelPlaying=false;reelProgress=0;drawReel()}
function drawReel(){clearInterval(reelTimer);let reels=all().filter(p=>p.kind==='reel'),p=reels[reelIndex];if(!p)return;openModal('vibe · Reel preview',`<div class="reelview" id="reelarea">${art(p)}<div class="reelcontrols"><div><b>${esc(p.user)}</b><p style="max-width:210px">${esc(p.caption)}</p><small>Illustrated placeholder • no video media</small></div><div style="display:grid;gap:8px"><button data-act="spark:${p.id}">💗</button><button data-act="echo:${p.id}">💬</button><button data-act="keep:${p.id}">🔖</button><button data-act="reelplay">${reelPlaying?'⏸':'▶'}</button><button data-act="reelsound">🔇</button></div></div><div class="progress"><i style="width:${reelProgress}%"></i></div></div><div class="row between" style="margin-top:12px">${btn('↑ Previous','reelprev','small')}${btn('Next ↓','reelnext','small')}</div><div class="notice">Playback is a simulated illustration progress preview, not streamed video.</div>`);if(reelPlaying)reelTimer=setInterval(()=>{reelProgress=(reelProgress+2)%101;let el=document.querySelector('.progress i');if(el)el.style.width=reelProgress+'%'},200)}
const botReplies={'Vibe Guide':'Use the five bottom tabs to navigate. Settings includes privacy, themes, and Close Friends.','Study Buddy':'Try 25 minutes of focused study, then take a short break. What topic are you learning?','Creative Buddy':'Try a pastel mood board or a caption about small happy moments!','Discovery Bot':'Explore safe interests like art, pets, science, music, and hobbies.','Fun Bot':'Riddle: What has keys but cannot open locks? A piano!'};
function showChat(who,bot=false){chatWith=who;botWith=bot?who:'';let entries=state.chats[who]||[];openModal(who+(bot?' · scripted bot':' · fictional demo'),`<div class="notice">${bot?'Scripted responses; not connected to an AI service.':'Local fictional messages; not delivered to anyone.'}</div><div class="chatbox" id="chatbox">${entries.map((m,i)=>`<div class="bubble ${m.me?'me':''}">${esc(m.text)} ${m.edited?'<small>Edited</small>':''}<div class="muted">${esc(m.time||'Demo')} ${m.deleted?'':m.me?`<button class="chip" data-act="editmsg:${i}">Edit</button> <button class="chip" data-act="delmsg:${i}">Delete</button>`:''}</div></div>`).join('')||'<div class="empty">Start a local demo conversation.</div>'}</div><div class="row"><input id="chatinput" class="field" placeholder="Message" maxlength="500" style="margin:10px 0">${btn('Send','sendmsg','small')}</div><button class="chip" data-act="chatoptions">⋯ Options</button>`)}
function action(a){let [cmd,...parts]=a.split(':'),id=parts.join(':'),p=getPost(id);if(cmd==='closemodal'){closeModal();return}if(cmd==='login'||cmd==='signup'){openModal(cmd==='login'?'Demo Login':'Demo Sign Up',`<div class="notice">Demo authentication only. No password required or stored; this does NOT create a secure account.</div><input id="authname" class="field" placeholder="Display name (optional)" maxlength="50">${btn('Enter local demo','enter')}`);return}if(cmd==='enter'){state.entered=true;state.account=true;state.name=$('authname')?.value.trim()||state.name;save();closeModal();render();return}if(cmd==='notifications'||cmd==='settings'){page=cmd==='settings'?'Settings':'Notifications';render();return}if(cmd==='goto'){page=id;render();return}if(cmd==='editprofile'){page='Edit Profile';render();return}if(cmd==='messagesettings'){page='Message Settings';render();return}if(cmd==='msgtab'){msgTab=id;render();return}if(cmd==='exploretab'){exploreTab=id;render();return}if(cmd==='searchtab'){searchTab=id;render();return}if(cmd==='notiftab'){notifTab=id;render();return}if(cmd==='profiletab'){profileTab=id;render();return}if(cmd==='link'||cmd==='close'||cmd==='block'||cmd==='restrict'){let arr=state[{link:'links',close:'close',block:'blocked',restrict:'restricted'}[cmd]];let i=arr.indexOf(id);i<0?arr.push(id):arr.splice(i,1);save();render();return}if(cmd==='spark'||cmd==='keep'){let arr=state[cmd==='spark'?'sparks':'keeps'];let i=arr.indexOf(p?.id);i<0?arr.push(p?.id):arr.splice(i,1);save();if(modal.startsWith('vibe · Reel'))drawReel();else render();return}if(cmd==='echo'){showEcho(id);return}if(cmd==='sendecho'){let v=$('echotext')?.value.trim();if(!v)return toast('Write an Echo first');(state.echoes[id]??=[]).push({user:'You',text:v});save();showEcho(id);return}if(cmd==='editecho'){let [post,index]=parts;let e=state.echoes[post]?.[+index];if(!e)return;openModal('Edit Echo',`<textarea id="editedecho" class="field">${esc(e.text)}</textarea>${btn('Save','saveecho:'+post+':'+index)}`);return}if(cmd==='saveecho'){let [post,index]=parts,e=state.echoes[post]?.[+index],v=$('editedecho')?.value.trim();if(e&&v){e.text=v;e.edited=true;save();showEcho(post)}return}if(cmd==='delecho'){let [post,index]=parts;state.echoes[post]?.splice(+index,1);save();showEcho(post);return}if(cmd==='openreel'){showReel(id);return}if(cmd==='openpost'){if(p)openModal('Drop preview',dropCard(p));return}if(cmd==='reels'){showReel(1);return}if(cmd==='reelnext'||cmd==='reelprev'){let len=all().filter(x=>x.kind==='reel').length;reelIndex=(reelIndex+(cmd==='reelnext'?1:-1)+len)%len;reelProgress=0;drawReel();return}if(cmd==='reelplay'){reelPlaying=!reelPlaying;drawReel();return}if(cmd==='reelsound'){toast('No sound: illustrated preview only');return}if(cmd==='options'){openModal('Drop options',`${p?.user==='You'?`${btn('Edit Drop','editdrop:'+id)} ${btn('Delete Drop','deletedrop:'+id)} ${btn(p.echoOff?'Enable Echoes':'Disable Echoes','toggleecho:'+id)}`:`${btn('Not Interested','notinterested:'+id)} ${btn('Report (demo)','report:'+id)}`} ${btn('Share','share:'+id)}`);return}if(cmd==='notinterested'){if(p){p.hidden=true;toast('Hidden from local Explore')}closeModal();render();return}if(cmd==='report'){toast('Demo report recorded locally; not sent to moderators');closeModal();return}if(cmd==='editdrop'){openModal('Edit Drop',`<textarea id="editdroptext" class="field">${esc(p.caption)}</textarea>${btn('Save changes','savedrop:'+id)}`);return}if(cmd==='savedrop'){let v=$('editdroptext')?.value.trim();if(p&&v){p.caption=v;p.edited=true;save();closeModal();render()}return}if(cmd==='deletedrop'){state.own=state.own.filter(x=>String(x.id)!==id);save();closeModal();render();return}if(cmd==='toggleecho'){p.echoOff=!p.echoOff;save();closeModal();render();return}if(cmd==='share'||cmd==='shareprofile'){let text=cmd==='shareprofile'?'vibe demo profile @'+state.username:'vibe fictional demo Drop #'+id;if(navigator.share)navigator.share({text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('Demo text copied')).catch(()=>toast(text));else toast(text);return}if(cmd==='previewdrop'){let caption=$('newcaption')?.value.trim();if(!caption)return toast('Add a caption');let category=$('newcategory').value,kind=$('newkind').value,audience=$('newaudience').value,p={id:'own-'+Date.now(),kind,category,emoji:icons[cats.indexOf(category)],title:'Your new vibe ✨',user:'You',caption,color:colors[2],time:new Date().toLocaleDateString(),audience};openModal('Preview your Drop',`${dropCard(p)}<div class="notice">Audience: ${esc(audience)} • local preview only</div>${btn('Publish locally','publish:'+encodeURIComponent(JSON.stringify(p)))}`);return}if(cmd==='publish'){try{state.own.unshift(JSON.parse(decodeURIComponent(id)));state.notifications.unshift({text:'Your Drop was saved to this device.',category:'Drops',read:false});save();closeModal();page='Profile';render();toast('Drop saved locally')}catch{toast('Could not save Drop')}return}if(cmd==='saveprofile'){state.name=$('editname').value.trim()||'Your Vibe';state.username=$('edituser').value.trim().replace(/[^\w.]/g,'').slice(0,25)||'myvibe';state.bio=$('editbio').value.slice(0,150);save();page='Profile';render();return}if(cmd==='addstory'){openModal('Create demo Story',`<textarea id="storytext" class="field" maxlength="150" placeholder="Your story text"></textarea><label>Duration<select id="storyduration" class="field"><option>12</option><option selected>24</option><option>48</option></select></label><label>Audience<select id="storyaudience" class="field"><option>Close Friends</option><option>Only Me</option><option>Vibe Circle</option><option>Everyone (local preview)</option></select></label>${btn('Post local Story','poststory')}`);return}if(cmd==='poststory'){let text=$('storytext').value.trim();if(!text)return toast('Write something first');state.stories.push({text,expires:Date.now()+Number($('storyduration').value)*3600000,audience:$('storyaudience').value});save();closeModal();toast('Story saved locally');return}if(cmd==='viewstory'){let i=+id;openModal('Fictional demo Story',`<div class="art" style="--c1:#ffd1dc;--c2:#b9d9ff"><span class="emoji">${icons[i%10]}</span><span class="arttitle">${esc(names[i])} · illustrated story</span></div><p>Fictional sample; no live story media.</p>`);return}if(cmd==='newhighlight'){let active=state.stories.filter(s=>s.expires>Date.now());openModal('New Highlight',`<input id="highlightname" class="field" placeholder="Highlight name"><select id="highlightcover" class="field"><option>🌸</option><option>✨</option><option>💚</option><option>🎨</option></select><select id="highlightaudience" class="field"><option>Only Me</option><option>Close Friends</option><option>Vibe Circle</option><option>Everyone (demo)</option></select><p>${active.length} active local Stories available</p>${btn('Save Highlight','savehighlight')}`);return}if(cmd==='savehighlight'){let n=$('highlightname').value.trim();if(!n)return toast('Enter a name');state.highlights.push({name:n,cover:$('highlightcover').value,audience:$('highlightaudience').value});save();closeModal();render();return}if(cmd==='highlight'){let h=state.highlights[+id];openModal('Highlight',`<h3>${esc(h.cover)} ${esc(h.name)}</h3><p>Audience: ${esc(h.audience)}</p><input id="hname" class="field" value="${esc(h.name)}"><select id="hcover" class="field"><option>🌸</option><option>✨</option><option>💚</option><option>🎨</option></select>${btn('Save edits','edithighlight:'+id)} ${btn('Move earlier','movehighlight:'+id)} ${btn('Delete','deletehighlight:'+id)}`);return}if(cmd==='edithighlight'){let h=state.highlights[+id];h.name=$('hname').value.trim()||h.name;h.cover=$('hcover').value;save();closeModal();render();return}if(cmd==='movehighlight'){let i=+id;if(i>0)[state.highlights[i-1],state.highlights[i]]=[state.highlights[i],state.highlights[i-1]];save();closeModal();render();return}if(cmd==='deletehighlight'){state.highlights.splice(+id,1);save();closeModal();render();return}if(cmd==='bot'||cmd==='chat'){showChat(id,cmd==='bot');return}if(cmd==='sendmsg'){let v=$('chatinput')?.value.trim();if(!v)return;let arr=state.chats[chatWith]??=[];arr.push({me:true,text:v,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});if(botWith)arr.push({me:false,text:botReplies[botWith]||'Scripted demo response',time:'Demo'});save();showChat(chatWith,!!botWith);return}if(cmd==='editmsg'){let m=state.chats[chatWith]?.[+id];if(!m)return;openModal('Edit message',`<textarea id="msgtext" class="field">${esc(m.text)}</textarea>${btn('Save','savemsg:'+id)}`);return}if(cmd==='savemsg'){let m=state.chats[chatWith]?.[+id],v=$('msgtext').value.trim();if(m&&v){m.text=v;m.edited=true;save();showChat(chatWith,!!botWith)}return}if(cmd==='delmsg'){let m=state.chats[chatWith]?.[+id];if(m){m.text='Message deleted (local demo)';m.deleted=true;save();showChat(chatWith,!!botWith)}return}if(cmd==='chatoptions'){openModal('Conversation options',`${btn('Block demo account','block:'+chatWith)} ${btn('Report demo','report:chat')}`);return}if(cmd==='newgroup'){openModal('Create Group',`<input id="groupname" class="field" placeholder="Group name" maxlength="50"><textarea id="groupdesc" class="field" placeholder="Description"></textarea>${btn('Create local Group','savegroup')}`);return}if(cmd==='savegroup'){let n=$('groupname').value.trim();if(!n)return toast('Enter a group name');state.groups.push({id:Date.now(),name:n,description:$('groupdesc').value,members:['You'],admins:['You'],owner:'You'});save();closeModal();render();return}if(cmd==='group'){let g=state.groups.find(g=>String(g.id)===id);if(!g)return;openModal(g.name,`<p>${esc(g.description)}</p><p>Members: ${g.members.map(esc).join(', ')}</p><p>Creator: ${esc(g.owner)} • local demo</p>${names.slice(0,5).map(n=>`<div class="item between">${esc(n)} ${btn(g.members.includes(n)?'Remove':'Invite','groupmember:'+id+':'+encodeURIComponent(n),'small')}</div>`).join('')}${btn('Mute group','mutegroup:'+id)}`);return}if(cmd==='groupmember'){let [gid,n]=parts,nm=decodeURIComponent(n),g=state.groups.find(x=>String(x.id)===gid);if(g){let i=g.members.indexOf(nm);i<0?g.members.push(nm):g.members.splice(i,1);save();action('group:'+gid)}return}if(cmd==='mutegroup'){state.muted.push(id);save();toast('Group muted locally');return}if(cmd==='readall'){state.notifications.forEach(n=>n.read=true);save();render();return}if(cmd==='clearhistory'){state.history=[];save();render();toast('Local history cleared');return}if(cmd==='signout'){state.entered=false;save();page='Home';render();return}if(cmd==='deactivate'){openModal('Deactivate demo profile',`<p>This only hides your local demo until you sign in again.</p>${btn('Deactivate locally','confirmdeactivate')}`);return}if(cmd==='confirmdeactivate'){state.entered=false;save();closeModal();render();return}if(cmd==='deleteaccount'){openModal('Delete local demo data',`<p>This permanently clears this browser's Vibe demo data immediately. This is NOT real cloud account deletion or a 30-day cancellation flow.</p>${btn('Erase local demo data','confirmdelete')}`);return}if(cmd==='confirmdelete'){localStorage.removeItem(KEY);state=fresh();closeModal();page='Home';render();return}if(cmd==='hashtag'){query=id;searchTab='Drops';render();return}}
document.addEventListener('click',e=>{let t=e.target.closest('[data-page],[data-act]');if(!t)return;if(t.dataset.page){page=t.dataset.page;closeModal();render();window.scrollTo(0,0)}else action(t.dataset.act)});document.addEventListener('change',e=>{let t=e.target;if(t.id==='theme'){state.theme=t.value;save();render()}if(t.id==='private'){state.private=t.checked;save();toast('Local privacy preview updated')}if(t.id==='messageperm'){state.settings.message=t.value;save()}if(t.id==='inviteperm'){state.settings.invite=t.value;save()}if(t.id==='previews'){state.settings.previews=t.checked;save()}if(t.id==='quiet'){state.settings.quiet=t.checked;save()}});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let pos=e.target.selectionStart;render();$('search')?.focus();$('search')?.setSelectionRange(pos,pos)}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();action(e.target.dataset.act)}});let startY=0;document.addEventListener('touchstart',e=>{if(e.target.closest('#reelarea'))startY=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(e.target.closest('#reelarea')){let dy=e.changedTouches[0].clientY-startY;if(Math.abs(dy)>60)action(dy<0?'reelnext':'reelprev')}},{passive:true});state.stories=state.stories.filter(s=>s.expires>Date.now());render();
</script></body></html>
